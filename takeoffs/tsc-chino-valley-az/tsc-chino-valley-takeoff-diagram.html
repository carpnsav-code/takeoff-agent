<!DOCTYPE html>
<html lang="en">
<head>

<title>TSC Chino Valley — Polished Concrete + Epoxy Takeoff</title>
<style>

  .wrap{max-width:2180px;margin:0 auto;padding:14px;}
  svg{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--panelline);border-radius:10px;box-shadow:0 1px 4px rgba(15,23,42,.10);}
  .sub{font-size:12px;color:var(--muted);margin:6px 4px 0;}
</style>
</head>
