<!DOCTYPE html>
<!--
  TAKEOFF DIAGRAM TEMPLATE  ·  "marked-up plan" style (see uploads/_examples-templates/)
  ================================================================================
  A one-sheet takeoff: the ACTUAL plan drawing as the base, scope highlighted in a
  translucent color, measurements badged on top, out-of-scope areas grayed, and
  info panels on the right (spec / measurements / quantities / risk / RFIs).

  HOW TO USE (copy this file into takeoffs/<project>/ and edit):
   1. Rasterize the plan:   python3 templates/rasterize-plan.py plan.pdf plan-images/crop.png --clip ...
      Point the <image href> below at that PNG. Set its display W×H to the crop's aspect.
   2. Trace the SCOPE polygon over the plan (see the big comment at ★SCOPE★ below).
   3. Move the SF badges (★BADGES★) onto each area; type the measured/tagged SF.
   4. Gray-wash the out-of-scope areas (★OUTOFSCOPE★) and carve cores.
   5. Fill the right-hand PANELS (★PANELS★) from the quantity sheet / spec / RFI list.
   6. Render:  NODE_PATH=$(npm root -g) node templates/render-diagram.js this.html out.png
   Tokens to replace are wrapped in {{DOUBLE_BRACES}}. Colors: teal=polish, other trades
   pick their own accent (Camp Bow Wow used red=epoxy F6, green=tile, blue=vinyl).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PROJECT_NAME}} — Takeoff Diagram</title>
<style>
  :root{
    --ink:#0f172a; --muted:#475569;
    --scope:#0e7490; --scope-dk:#0b4a5c;   /* SCOPE accent — teal=polish; swap per trade */
    --brass:#b45309; --risk:#b91c1c; --rfi:#7c3aed; --ok:#0f766e;
    --panelline:#e2e8f0; --bg:#eef2f6;
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:2180px;margin:0 auto;padding:14px;}
  svg{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--panelline);border-radius:10px;box-shadow:0 1px 4px rgba(15,23,42,.10);}
  .sub{font-size:12px;color:var(--muted);margin:6px 4px 0;}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 2180 1330" role="img" aria-label="Marked-up plan takeoff diagram">
  <defs>
    <pattern id="hatch" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f1f5f9"/><path d="M0 0 V12" stroke="#cbd5e1" stroke-width="1.4"/>
    </pattern>
  </defs>

  <!-- HEADER -->
  <rect x="0" y="0" width="2180" height="66" fill="#0b4a5c"/>
  <text x="22" y="30" fill="#fff" font-size="22" font-weight="700">{{PROJECT_NAME}} — {{TRADE}} Takeoff</text>
  <text x="22" y="52" fill="#cbe7ef" font-size="13">{{ADDRESS}} · {{SPEC_SECTION}} · Marked up on {{SHEET}} ({{SCALE}}) · Prepared {{DATE}}</text>
  <text x="2158" y="30" fill="#fff" font-size="13" text-anchor="end" font-weight="700">{{ACCENT_LABEL}}</text>
  <text x="2158" y="50" fill="#cbe7ef" font-size="12" text-anchor="end">{{SF_CAVEAT}}</text>

  <!-- LEFT: PLAN + OVERLAY (local 1500x{{PLAN_H}} viewBox) -->
  <text x="22" y="86" font-size="15" font-weight="700">{{SHEET}} — {{PLAN_SUBTITLE}}</text>
  <svg x="20" y="92" width="1500" height="{{PLAN_H}}" viewBox="0 0 1500 {{PLAN_H}}">
    <!-- the real drawing (★set href + match W:H to the crop's pixel aspect★) -->
    <image href="{{PLAN_IMAGE}}" x="0" y="0" width="1500" height="{{PLAN_H}}" preserveAspectRatio="xMidYMid meet"/>

    <!-- ★OUTOFSCOPE★ gray washes over BOH / adjacent tenants (repeat as needed) -->
    <rect x="{{OOS_X}}" y="{{OOS_Y}}" width="{{OOS_W}}" height="{{OOS_H}}" fill="#94a3b8" opacity="0.28"/>
    <text x="{{OOS_TX}}" y="{{OOS_TY}}" font-size="15" font-weight="700" fill="#334155">{{OOS_LABEL}}</text>

    <!-- ★SCOPE★ polygon: trace the scope perimeter in this 1500-wide space.
         Method: open the plan PNG, note pixel coords of each corner, multiply by
         (1500 / crop_pixel_width). Go clockwise. Two stacked polygons = translucent
         fill + dashed white edge for legibility over busy linework. -->
    <polygon points="{{SCOPE_POINTS}}" fill="var(--scope)" opacity="0.26" stroke="var(--scope-dk)" stroke-width="4"/>
    <polygon points="{{SCOPE_POINTS}}" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="9 6" opacity="0.85"/>

    <!-- carve out vertical cores / excluded pockets inside the scope (repeat as needed) -->
    <rect x="{{CORE_X}}" y="{{CORE_Y}}" width="{{CORE_W}}" height="{{CORE_H}}" fill="#e5e7eb" stroke="#64748b" stroke-dasharray="3 3"/>
    <text x="{{CORE_TX}}" y="{{CORE_TY}}" font-size="10.5" fill="#475569" text-anchor="middle">{{CORE_LABEL}}</text>

    <!-- ★BADGES★ one per area. Duplicate this <g> block; set x/y and the two labels. -->
    <g text-anchor="middle">
      <rect x="{{BADGE_X}}" y="{{BADGE_Y}}" width="132" height="44" rx="7" fill="#fff" stroke="var(--scope-dk)" stroke-width="1.6" opacity="0.96"/>
      <text x="{{BADGE_CX}}" y="{{BADGE_TY1}}" font-size="12" fill="var(--muted)">{{AREA_NAME}}</text>
      <text x="{{BADGE_CX}}" y="{{BADGE_TY2}}" font-size="16" font-weight="800" fill="var(--scope-dk)">{{AREA_SF}}</text>
    </g>

    <!-- optional marker symbols (e.g., brass markers, drains). Duplicate as needed. -->
    <g transform="translate({{MK_X}},{{MK_Y}})"><path d="M0,-10 L10,0 L0,10 L-10,0 Z" fill="var(--brass)" stroke="#fff" stroke-width="1.6"/></g>

    <!-- LEGEND (park it in an empty corner of the plan) -->
    <g>
      <rect x="35" y="{{LEG_Y}}" width="392" height="235" rx="8" fill="#fff" stroke="var(--panelline)" opacity="0.98"/>
      <text x="52" y="{{LEG_Y1}}" font-size="15" font-weight="700">LEGEND</text>
      <rect x="52" y="{{LEG_Y2}}" width="26" height="16" fill="var(--scope)" opacity="0.30" stroke="var(--scope-dk)" stroke-width="2"/>
      <text x="88" y="{{LEG_TY2}}" font-size="13" fill="var(--muted)">{{TRADE}} scope</text>
      <rect x="52" y="{{LEG_Y3}}" width="26" height="16" fill="#94a3b8" opacity="0.30"/>
      <text x="88" y="{{LEG_TY3}}" font-size="13" fill="var(--muted)">Out of scope</text>
      <text x="52" y="{{LEG_NOTE_Y}}" font-size="11.5" fill="var(--risk)" font-weight="700">Scope outline approximate — confirm SF via CAD/dimensioned plan.</text>
    </g>
  </svg>

  <!-- ★PANELS★ RIGHT COLUMN (x 1540..2160). Fill from quantity sheet / spec / RFI list. -->
  <!-- SPEC -->
  <rect x="1540" y="92" width="620" height="212" rx="8" fill="#f8fafc" stroke="var(--panelline)"/>
  <rect x="1540" y="92" width="620" height="26" rx="8" fill="var(--ok)"/>
  <text x="1554" y="110" fill="#fff" font-size="13" font-weight="700">FINISH SPECIFIED — {{SPEC_SECTION}}</text>
  <text x="1554" y="140" font-size="12.5">{{SPEC_LINE_1}}</text>
  <text x="1554" y="162" font-size="12.5">{{SPEC_LINE_2}}</text>
  <text x="1554" y="184" font-size="12.5">{{SPEC_LINE_3}}</text>
  <text x="1554" y="206" font-size="12.5">{{SPEC_LINE_4}}</text>
  <text x="1554" y="228" font-size="12.5">{{SPEC_LINE_5}}</text>
  <text x="1554" y="250" font-size="12.5">{{SPEC_LINE_6}}</text>
  <text x="1554" y="272" font-size="12.5">{{SPEC_LINE_7}}</text>
  <text x="1554" y="294" font-size="12.5">{{SPEC_LINE_8}}</text>

  <!-- MEASUREMENTS -->
  <rect x="1540" y="316" width="620" height="288" rx="8" fill="#ecfeff" stroke="#a5e0ec"/>
  <rect x="1540" y="316" width="620" height="26" rx="8" fill="var(--scope)"/>
  <text x="1554" y="334" fill="#fff" font-size="13" font-weight="700">MEASUREMENTS — from plan tags / scale</text>
  <!-- rows: <text left>label</text><text right anchor>value</text> -->
  <text x="1554" y="548" font-size="12.5" font-weight="700">Net area</text>
  <text x="2146" y="548" font-size="14" font-weight="800" fill="var(--scope-dk)" text-anchor="end">{{NET_SF}}</text>
  <text x="1554" y="572" font-size="13" font-weight="700">Gross scope area</text>
  <text x="2146" y="574" font-size="19" font-weight="800" fill="var(--scope-dk)" text-anchor="end">{{GROSS_SF}}</text>
  <text x="1554" y="594" font-size="10.5" fill="var(--risk)" font-weight="700">{{SF_METHOD_NOTE}}</text>

  <!-- QUANTITIES -->
  <rect x="1540" y="616" width="620" height="236" rx="8" fill="#f8fafc" stroke="var(--panelline)"/>
  <rect x="1540" y="616" width="620" height="26" rx="8" fill="var(--ok)"/>
  <text x="1554" y="634" fill="#fff" font-size="13" font-weight="700">KEY TAKEOFF QUANTITIES</text>
  <!-- duplicate row pairs; right-anchor the value at x=2146 -->

  <!-- RISK -->
  <rect x="1540" y="864" width="620" height="158" rx="8" fill="#fef2f2" stroke="#f4c7c7"/>
  <rect x="1540" y="864" width="620" height="26" rx="8" fill="var(--risk)"/>
  <text x="1554" y="882" fill="#fff" font-size="13" font-weight="700">EXCLUDED / UNIT-PRICE ADDS</text>

  <!-- RFIs -->
  <rect x="1540" y="1034" width="620" height="230" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="1540" y="1034" width="620" height="26" rx="8" fill="var(--rfi)"/>
  <text x="1554" y="1052" fill="#fff" font-size="13" font-weight="700">TOP RFIs (★ price-critical)</text>
</svg>
<p class="sub">{{FOOTER}}</p>
</div>
</body>
</html>
